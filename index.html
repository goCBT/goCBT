<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goCBT - Practice Online Exams</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="goCBT white_logo.png" alt="goCBT Logo" />
      <span>goCBT</span>
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Log in</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Practice Online Exams and Pass with Confidence</h1>
    <p>Prepare for JAMB, WAEC, NECO, and more with our user-friendly CBT practice tests.</p>
    <a href="https://gocbt.github.io/DIgitalSolution/" class="cta">Get Started</a>
  </section>

  <section class="carousel-tabs">
    <button onclick="showCarousel('subjects')">SUBJECTS</button>
    <button onclick="showCarousel('exams')">EXAMS</button>
    <button onclick="showCarousel('courses')">COURSES</button>
  </section>

  <section class="carousel" id="carousel">
    <!-- Carousel items will be injected here -->
  </section>

  <section class="testimonial">
    <div class="quote">
      <p>“goCBT helped me pass my exams with confidence!”</p>
    </div>
    <div class="profile">
      <img src="student.jpg" alt="Student Testimonial" />
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
